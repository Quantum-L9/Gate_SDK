# ─────────────────────────────────────────────────────────────────────────────
# Gate_SDK — Release & PyPI Publish Pipeline

# Triggered on: push to vX.Y.Z tag | workflow_dispatch (rehearsal only)

# Gates (sequential, each blocks publish):
# 1 verify-tag     — semver vX.Y.Z + version matches pyproject.toml
#                    + release-identity gate: the tag is the ledger's release
#                    tag, and the checked-out HEAD is exactly its object
# 2 quality-gate   — lint + typecheck + contracts + schema-drift + tests
# 3 dep-audit      — pip-audit CVE scan on release candidate
# 4 build          — python -m build → sdist + wheel
# 5 sbom           — CycloneDX SBOM generation
# 6 publish        — PyPI Trusted Publisher (OIDC)
# 7 gh-release     — GitHub Release with dist/* + SBOM
# 8 promote        — move the moving major channel (v1) onto the release,
#                    then prove v1 == vX.Y.Z at the canonical remote

# ci.yml is a PR/push gate — it NEVER publishes.
# This file is the ONLY release authority: identity gate, publication, and
# channel promotion all live here. There is no second release workflow.
#
# workflow_dispatch is a rehearsal: it runs gates 1-5 against the dispatched
# ref and can never publish, create a release, or move the channel. Every
# publication is bound to an immutable tag push.
# ─────────────────────────────────────────────────────────────────────────────

name: release-publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
  workflow_dispatch:

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"

# ─────────────────────────────────────────────────────────────────────────────
# GATE 1 — Tag + version consistency check
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  verify-tag:
    name: gate-1-tag-version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          # The identity gate judges tag objects and channel ancestry; a
          # shallow checkout has neither.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Extract tag version
        id: extract
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            # Rehearsal: no tag exists, so name the artifacts after the tree.
            VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
            TAG="rehearsal"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG} → Version: ${VERSION}"

      - name: Verify version matches pyproject.toml
        env:
          TAG_VERSION: ${{ steps.extract.outputs.version }}
        run: |
          TOML_VERSION=$(python - <<'PY'
          import re, pathlib
          text = pathlib.Path("pyproject.toml").read_text()
          m = re.search(r'^\s*version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          print(m.group(1) if m else "NOT_FOUND")
          PY
          )
          echo "pyproject.toml version: ${TOML_VERSION}"
          echo "Tag version:            ${TAG_VERSION}"
          if [[ "${TOML_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::Version mismatch — pyproject.toml has '${TOML_VERSION}' but tag is '${TAG_VERSION}'"
            exit 1
          fi

      - name: Release identity gate (tag == ledger, HEAD == tag object)
        if: ${{ github.event_name == 'push' }}
        # Fails closed. The pushed tag must be the ledger's release tag, it
        # must resolve at the canonical remote, and HEAD must be that object:
        # a later commit that kept the same version and ledger is not the
        # release. The channel may lag (promotion is gate 8) but only behind.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/validate_release_identity.py --release-gate "${RELEASE_TAG}"

      - name: Release identity (structural rehearsal)
        if: ${{ github.event_name != 'push' }}
        run: python scripts/validate_release_identity.py

# ─────────────────────────────────────────────────────────────────────────────
# GATE 2 — Full quality gate (defence-in-depth re-run on release commit)
# ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: gate-2-quality
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      L9_ENVIRONMENT: "test"
      L9_DEV_MODE: "false"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Mypy strict
        run: mypy src

      - name: Contract validation
        run: python scripts/validate_contracts.py

      - name: Schema drift check
        run: |
          python scripts/generate_schema.py
          git diff --exit-code contracts/transport-packet.schema.json || {
            echo "::error::Schema drift on release commit — commit the regenerated schema first"
            exit 1
          }

      - name: Pytest (full suite)
        run: pytest -q --tb=short

# ─────────────────────────────────────────────────────────────────────────────
# GATE 3 — Dependency CVE audit on release candidate
# ─────────────────────────────────────────────────────────────────────────────
  dep-audit:
    name: gate-3-dep-audit
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package + audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit

      - name: pip-audit (release gate)
        # --skip-editable: the release candidate itself is installed editable
        # (pip install -e ".[dev]") and is never on PyPI *before* this pipeline
        # publishes it, so pip-audit cannot resolve it for audit.
        # No --strict: --strict treats any skipped dependency (including
        # editable skips) as a fatal collection failure, which would defeat
        # --skip-editable entirely. Real vulnerability findings still exit 1
        # regardless of --strict, so this gate still fails closed on CVEs in
        # actual third-party dependencies.
        run: ./scripts/pip_audit_gated.sh --skip-editable

# ─────────────────────────────────────────────────────────────────────────────
# GATE 4 — Build release artifacts
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: gate-4-build
    needs: [dep-audit, verify-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build toolchain
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify dist contents
        run: |
          ls -lh dist/
          python -m pip install twine
          twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist-${{ needs.verify-tag.outputs.version }}
          path: dist/*
          retention-days: 90

# ─────────────────────────────────────────────────────────────────────────────
# GATE 5 — SBOM generation (supply-chain provenance)
# ─────────────────────────────────────────────────────────────────────────────
  sbom:
    name: gate-5-sbom
    needs: [build, verify-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package + CycloneDX tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install cyclonedx-bom

      - name: Generate SBOM
        env:
          RELEASE_VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          cyclonedx-py environment \
            --output-format json \
            --output-file "sbom-${RELEASE_VERSION}.cdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ needs.verify-tag.outputs.version }}
          path: sbom-${{ needs.verify-tag.outputs.version }}.cdx.json
          retention-days: 365

# ─────────────────────────────────────────────────────────────────────────────
# GATE 6 — PyPI Trusted Publisher (OIDC)
# Skipped entirely on dry-run.
# ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: gate-6-pypi-publish
    needs: [build, sbom, verify-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-release
    # Only a tag push publishes. A dispatch is a rehearsal with no path here.
    if: ${{ github.event_name == 'push' }}
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist-${{ needs.verify-tag.outputs.version }}
          path: dist/

      - name: Publish to PyPI (Trusted Publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          print-hash: true
          verbose: true

# ─────────────────────────────────────────────────────────────────────────────
# GATE 7 — GitHub Release
# ─────────────────────────────────────────────────────────────────────────────
  gh-release:
    name: gate-7-github-release
    needs: [verify-tag, publish, sbom]
    # Tag pushes only: a rehearsal must never create a release. A release
    # still follows a skipped PyPI publish, which keeps the GitHub Release as
    # the delivery path while no PyPI artifact exists (see the ledger).
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.verify-tag.result == 'success' &&
      needs.sbom.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist-${{ needs.verify-tag.outputs.version }}
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom-${{ needs.verify-tag.outputs.version }}
          path: sbom/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: "v${{ needs.verify-tag.outputs.version }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.verify-tag.outputs.version, 'rc') }}
          files: |
            dist/*
            sbom/*.cdx.json

# ─────────────────────────────────────────────────────────────────────────────
# GATE 8 — Promote the moving major channel (consumer compatibility contract)
# Consumers declare v{major}. It moves here, after every gate, and nowhere
# else. Release candidates never move it. The target is the object gate 1
# bound HEAD to, and the job re-proves agreement at the remote afterwards.
# ─────────────────────────────────────────────────────────────────────────────
  promote-channel:
    name: gate-8-promote-channel
    needs: [verify-tag, gh-release]
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-rc') && needs.gh-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi-release
    concurrency:
      group: gate-sdk-channel-promotion
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Re-run the release gate immediately before promotion
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/validate_release_identity.py --release-gate "${RELEASE_TAG}"

      - name: Move the channel onto the release object
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_SHA=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          if [[ "${RELEASE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::${RELEASE_TAG} is ${RELEASE_SHA}, run is ${GITHUB_SHA}"
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          CHANNEL="v${VERSION%%.*}"
          # Moving a major tag is by definition a non-fast-forward ref update;
          # the release gate above has already proved it only moves forward.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "+${RELEASE_SHA}:refs/tags/${CHANNEL}"
          echo "Promoted ${CHANNEL} -> ${RELEASE_TAG} (${RELEASE_SHA})"

      - name: Prove channel agreement at the canonical remote
        run: python scripts/validate_release_identity.py --verify-tag

# ─────────────────────────────────────────────────────────────────────────────
# ALL RELEASE GATES PASSED — aggregator
# ─────────────────────────────────────────────────────────────────────────────
  all-release-gates-passed:
    name: "all-release-gates-passed ✅"
    needs: [verify-tag, quality-gate, dep-audit, build, sbom, publish, gh-release, promote-channel]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Evaluate release gates
        run: |
          FAILED=""
          [[ "${{ needs.verify-tag.result }}" != "success" ]] && FAILED="$FAILED verify-tag"
          [[ "${{ needs.quality-gate.result }}" != "success" ]] && FAILED="$FAILED quality-gate"
          [[ "${{ needs.dep-audit.result }}" != "success" ]] && FAILED="$FAILED dep-audit"
          [[ "${{ needs.build.result }}" != "success" ]] && FAILED="$FAILED build"
          [[ "${{ needs.sbom.result }}" != "success" ]] && FAILED="$FAILED sbom"
          SKIP_PUBLISH="${{ needs.publish.result == 'skipped' }}"
          if [[ "$SKIP_PUBLISH" != "true" && "${{ needs.publish.result }}" != "success" ]]; then
            FAILED="$FAILED publish"
          fi
          if [[ "${{ github.event_name }}" == "push" ]]; then
            [[ "${{ needs.gh-release.result }}" != "success" ]] && FAILED="$FAILED gh-release"
            if [[ "${{ github.ref_name }}" != *-rc* && "${{ needs.promote-channel.result }}" != "success" ]]; then
              FAILED="$FAILED promote-channel"
            fi
          fi
          if [[ -n "$FAILED" ]]; then
            echo "::error::RELEASE BLOCKED — failed gates:$FAILED"
            exit 1
          fi
          echo "All release gates passed ✅"
