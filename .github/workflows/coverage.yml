name: coverage

on:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: pytest-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements/*.lock

      # Hash-locked installs; see the note in ci.yml (issue #53).
      - name: Install packaging toolchain (hash-locked)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/build.lock

      - name: Install package with dev dependencies (hash-locked)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.lock
          python -m pip install --no-index --no-deps --no-build-isolation -e .
          python -m pip check

      # make-v2: a pull request runs the bounded `make test-fast` selection and
      # gates coverage of the lines it changes at 80% (diff-cover against the
      # PR base). The whole suite, with the whole-repository 80% floor, runs
      # nightly and on demand (workflow_dispatch). Neither floor is lowered.
      - name: Run bounded pytest with coverage (pull request)
        if: github.event_name == 'pull_request'
        env:
          PYTEST_ADDOPTS: >-
            --cov=constellation_node_sdk
            --cov-report=xml:coverage.xml
            --cov-report=term-missing
        run: make test-fast

      - name: Gate coverage of changed lines at 80% (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/coverage.lock
          diff-cover coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=80

      - name: Run pytest with coverage (nightly, dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          pytest -q \
            --cov=constellation_node_sdk \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

# NOTE: This job previously declared `needs: [quality]`, intending to depend
# on the "quality" job defined in ci.yml. GitHub Actions' `needs:` can only
# reference jobs within the SAME workflow file — cross-workflow dependencies
# are not supported this way (a job named "quality" doesn't even exist in
# ci.yml). That reference was dangling and caused this workflow to fail with
# a startup_failure before any job ever ran. Removed; this job now runs
# independently in parallel with ci.yml on the same push/pull_request
# trigger, matching integration.yml's pattern.
# Enforcement: on pull requests the job fails if diff-cover reports changed-line
# coverage under 80%; nightly and on dispatch it fails if the whole-suite
# pytest --cov-fail-under=80 exits non-zero.
# To add as a required status check, enable branch protection on main/master
# and add "coverage / pytest-coverage (3.12)" to required checks.
